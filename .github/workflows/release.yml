name: Build and publish release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versão a publicar, por exemplo v1.8.0"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  BUILD_TAG: ${{ inputs.tag || github.ref_name }}
  NODE_VERSION: "22.23.3"
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0
          package_json_file: for-web/package.json
          cache: true
          cache_dependency_path: for-web/pnpm-lock.yaml
      - id: version
        run: node scripts/release-ci.cjs validate
      - run: pnpm --dir for-web install --frozen-lockfile
      - run: node scripts/build-web.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend
          path: for-web/packages/client/dist/
          retention-days: 1
          if-no-files-found: error
  windows:
    needs: web
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.17.0
          package_json_file: for-desktop/package.json
          cache: true
          cache_dependency_path: for-desktop/pnpm-lock.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: for-web/packages/client/dist/
      - run: pnpm --dir for-desktop install --frozen-lockfile
      - run: node for-desktop/scripts/build-windows.cjs --prebuilt-web
      - run: node scripts/release-ci.cjs windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-windows
          path: artifacts/windows/
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
  android:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend
          path: for-web/packages/client/dist/
      - run: npm ci --ignore-scripts
        working-directory: for-mobile
      - run: node scripts/release-ci.cjs mobile
      - run: node node_modules/@capacitor/cli/bin/capacitor sync android
        working-directory: for-mobile
      - name: Prepare Android SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build signed APK
        working-directory: for-mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Configure a chave fixa de assinatura Android nos secrets.'; exit 1; }
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/bofonasu-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          bash gradlew --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "../../artifacts/mobile/Bofonasu-Stout-Android-${{ needs.web.outputs.version }}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-android
          path: artifacts/mobile/*.apk
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
  ios:
    needs: web
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend
          path: for-web/packages/client/dist/
      - run: npm ci --ignore-scripts
        working-directory: for-mobile
      - run: node scripts/release-ci.cjs mobile
      - run: node node_modules/@capacitor/cli/bin/capacitor sync ios
        working-directory: for-mobile
      - name: Build iPhone/iPad app without signing
        env:
          APP_VERSION: ${{ needs.web.outputs.version }}
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcodebuild -project for-mobile/ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/ipa/Payload/"
          /usr/bin/ditto -c -k --keepParent "$RUNNER_TEMP/ipa/Payload" "artifacts/mobile/Bofonasu-Stout-iOS-$APP_VERSION-unsigned.ipa"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-ios
          path: artifacts/mobile/*.ipa
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: [web, windows, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts/publish
      - run: node scripts/release-ci.cjs notes
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd artifacts/publish
          sha256sum * > SHA256SUMS.txt
          cd ../..
          RELEASE_COMMIT=$(git rev-parse HEAD)
          git fetch origin --tags
          if git rev-parse "$BUILD_TAG^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$BUILD_TAG^{commit}")" = "$RELEASE_COMMIT" || { echo 'A tag aponta para outro código; prepare uma versão nova.'; exit 1; }
          else
            gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$BUILD_TAG" -f "sha=$RELEASE_COMMIT"
          fi
          if gh release view "$BUILD_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$BUILD_TAG" --json isDraft --jq .isDraft)" = true || { echo 'A release já está publicada; crie uma nova versão.'; exit 1; }
            gh release upload "$BUILD_TAG" artifacts/publish/* --clobber
          else
            gh release create "$BUILD_TAG" artifacts/publish/* --verify-tag --draft --title "Bofonasu Stout ${{ needs.web.outputs.version }}" --notes-file release-notes-ci.md
          fi
          gh release edit "$BUILD_TAG" --draft=false --latest --notes-file release-notes-ci.md
